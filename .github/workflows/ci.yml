name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check syntax and module imports
        run: |
          for file in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$file"
          done
          node -e "Promise.all(['./routes/authRoutes.js','./routes/propertyRoutes.js','./routes/bookingRoutes.js','./routes/reviewRoutes.js','./routes/userRoutes.js','./routes/notificationRoutes.js','./routes/ratingRoutes.js','./routes/leaveRequestRoutes.js','./routes/adminRoutes.js'].map(m => import(m)))"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
